# Saytni qurib, GitHub Pages'ga joylashtiradi.
#
# Sayt Pages sozlamasining uchala rejimida ham ochiladi:
#
#   A) "Deploy from a branch" → manba branchi /(root)
#      Repozitoriya root'ida qurilgan sayt (index.html + assets/) turadi.
#   B) "Deploy from a branch" → gh-pages /(root)
#      Quyidagi qadam har push'da shu branchni yangilaydi.
#   C) "GitHub Actions"
#      Artefakt yuklanadi va deploy-pages orqali tarqatiladi.
#
# Sayt manzili: https://<foydalanuvchi>.github.io/maqsadqoy/
name: Deploy

on:
  push:
    branches: [main, master, claude/great-rubin-cu2rwu]
  workflow_dispatch:

permissions:
  contents: write # gh-pages branchiga yozish uchun
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Jekyll qurilgan fayllarga tegmasligi uchun
      - run: touch dist/.nojekyll

      # ---------------------------------------------------------------
      # Zaxira yo'l: qurilgan saytni gh-pages branchiga ham joylaymiz.
      # Shu tufayli Pages "Deploy from a branch" rejimida qolsa ham,
      # branch sifatida gh-pages ni tanlash kifoya.
      # ---------------------------------------------------------------
      - name: Publish to gh-pages branch
        run: |
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy $GITHUB_SHA"
          git push -f "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Quyidagi qadamlar faqat Source: "GitHub Actions" bo'lganda ishlaydi.
      # Aks holda ular xatoga uchraydi — bu normal, chunki sayt yuqoridagi
      # gh-pages branchi orqali baribir joylashtirilgan.
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
